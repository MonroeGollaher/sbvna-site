backend:
  name: git-gateway
  branch: main

site_url: "https://sbvna.com"
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "src/content/home/home.json"
        preview_path: "/"
        fields:
          - { name: "title", label: "Homepage Headline", widget: "text", hint: "Use a new line to split the headline across two lines." }
          - { name: "intro", label: "Homepage Subtitle", widget: "string" }
          - { name: "blurb", label: "Neighborhood Introduction", widget: "text" }
          - label: "Announcement Banner"
            name: "banner"
            widget: "object"
            collapsed: true
            hint: "An event within the next month takes priority over this announcement."
            fields:
              - { name: "enabled", label: "Show Banner", widget: "boolean", default: false, hint: "Toggle the announcement banner on the home page" }
              - { name: "message", label: "Message", widget: "string", required: false }
              - { name: "linkText", label: "Link Text", widget: "string", required: false, hint: "e.g. View events" }
              - { name: "linkUrl", label: "Link URL", widget: "string", required: false, hint: "e.g. /events" }
              - { name: "expires", label: "Show Until", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "The banner hides itself after this date. Leave blank to show it until it's turned off." }
          - label: "Neighborhood Poster"
            name: "poster"
            widget: "object"
            collapsed: true
            fields:
              - { name: "title", label: "Heading", widget: "text" }
              - { name: "image", label: "Poster Image", widget: "image" }
              - { name: "imageAlt", label: "Image Alt Text", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }
              - { name: "dimensions", label: "Dimensions", widget: "string" }
              - { name: "donation", label: "Donation Label", widget: "string" }
              - { name: "email", label: "Request Email", widget: "string" }

      - name: "about"
        label: "About"
        file: "src/content/about/about.json"
        preview_path: "about"
        fields:
          - { name: "title", label: "Page Title", widget: "string" }
          - { name: "blurb", label: "Intro Blurb", widget: "text" }
          - { name: "headerImage", label: "Header Image", widget: "image", required: false }
          - { name: "headerImageAlt", label: "Header Image Alt Text", widget: "string", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Section Title", widget: "string" }
              - { name: "blurb", label: "Section Text", widget: "text" }
              - { name: "image", label: "Section Image", widget: "image", required: false }
              - { name: "imageAlt", label: "Section Image Alt Text", widget: "string", required: false }
              - { name: "imageCaption", label: "Section Image Caption", widget: "text", required: false }
              - name: "layout"
                label: "Image Layout"
                widget: "select"
                required: false
                options:
                  - { label: "Image below text", value: "stacked" }
                  - { label: "Image beside text", value: "flex" }

      - name: "events"
        label: "Events Page"
        file: "src/content/events/events.json"
        preview_path: "events"
        fields:
          - { name: "title", label: "Page Title", widget: "string" }
          - { name: "blurb", label: "Page Intro", widget: "text" }
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "id", label: "ID", widget: "string", hint: "Short unique id, e.g. spring-cleanup-2026" }
              - { name: "title", label: "Event Title", widget: "string" }
              - { name: "description", label: "Description", widget: "text" }
              - { name: "startTime", label: "Start Time", widget: "datetime" }
              - { name: "endTime", label: "End Time", widget: "datetime", required: false }
              - { name: "location", label: "Location", widget: "string" }
              - { name: "image", label: "Image", widget: "image", required: false }
              - { name: "imageAlt", label: "Image Alt Text", widget: "string", required: false }
              - { name: "ctaText", label: "Button Text", widget: "string", required: false }
              - { name: "ctaUrl", label: "Button URL", widget: "string", required: false }
              - { name: "tags", label: "Tags", widget: "list", required: false }
              - { name: "isFeatured", label: "Featured", widget: "boolean", required: false, default: false }

      - name: "resources"
        label: "Resources Page"
        file: "src/content/resources/resources.json"
        preview_path: "resources"
        fields:
          - { name: "title", label: "Page Title", widget: "string" }
          - { name: "blurb", label: "Page Intro", widget: "text" }
          - { name: "meta", widget: "hidden", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "id", label: "Section ID", widget: "string", required: false }
              - { name: "title", label: "Section Title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    options: ["link", "contact", "text", "document"]
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "url", label: "URL", widget: "string", required: false }
                  - { name: "description", label: "Description", widget: "text", required: false }
                  - { name: "name", label: "Contact Name", widget: "string", required: false }
                  - { name: "email", label: "Email", widget: "string", required: false }
                  - { name: "phone", label: "Phone", widget: "string", required: false }
                  - { name: "alternatePhone", label: "Alternate Phone", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "text", required: false }
                  - { name: "body", label: "Body Text", widget: "text", required: false }
                  - { name: "fileType", label: "File Type", widget: "string", required: false }

  - name: "board"
    label: "Board"
    files:
      - name: "members"
        label: "Board Members"
        file: "src/content/board/board.json"
        preview_path: "board"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} - {{fields.role}}"
            fields:
              - { name: "name", label: "Name", widget: "string" }
              - { name: "role", label: "Role", widget: "string" }
              - { name: "email", label: "Email", widget: "string", required: false }
              - { name: "photo", label: "Photo", widget: "image", required: false }
              - { name: "photoPosition", label: "Photo Crop Position", widget: "string", required: false, hint: "Optional horizontal and vertical position, e.g. 50% 20% to keep more of the top of the photo." }
              - { name: "bio", label: "Bio", widget: "text", required: false }

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    preview_path: "gallery"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "uploadDate", label: "Date Added", widget: "datetime", required: false, default: "{{now}}", format: "YYYY-MM-DD", date_format: "MMM D, YYYY", time_format: false, hint: "When this album was added to the site, not when the photos were taken." }
      - { name: "image", label: "Cover / Single Photo", widget: "image", required: false }
      - { name: "imageAlt", label: "Cover Alt Text", widget: "string", required: false }
      - { name: "caption", label: "Caption", widget: "text", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "sourcePage", widget: "hidden", required: false }

      - name: "photos"
        label: "Gallery Photos"
        widget: "list"
        required: false
        hint: "Add multiple photos for an event album, or use the single photo field above. Navigation appears only for multiple photos."
        summary: "{{fields.imageAlt}}"
        fields:
          - { name: "image", label: "Photo / Thumbnail", widget: "image" }
          - { name: "fullImage", label: "Larger Photo (optional)", widget: "image", required: false }
          - { name: "imageAlt", label: "Photo Alt Text", widget: "string" }
          - { name: "caption", label: "Caption", widget: "text", required: false }
          - { name: "originalTitle", widget: "hidden", required: false }
          - { name: "sourceImage", widget: "hidden", required: false }

  - name: "documents"
    label: "Documents"
    folder: "src/content/documents"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    preview_path: "documents"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "category",
          label: "Category",
          widget: "select",
          options: ["Association Articles & Bylaws", "Newsletters", "Annual Reports", "Transportation Surveys", "Meeting Minutes", "Misc"]
        }
      - { name: "image", label: "Preview Image", widget: "image", required: false }
      - { name: "file", label: "PDF / File", widget: "file", required: false, hint: "Upload a file or provide External Link below." }
      - { name: "externalUrl", label: "External Link", widget: "string", required: false, hint: "Use if linking to another website instead of uploading a file." }
      - { name: "description", label: "Description", widget: "text", required: false }
